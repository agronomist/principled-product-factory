name: Kitchen Brigade CI

on:
  push:
    branches: [ main, "factory/**" ]
  pull_request:
    branches: [ main ]

jobs:
  live-tasting-harness:
    name: Validate Plugin Manifests, Hooks, Clean Install & 42 Skills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run 5-Step Live Tasting Harness (Fire Up -> Station Check -> Plate -> Proof -> Dishpit)
        run: bash skills/head-chef-mode/scripts/run-live-tasting.sh

      - name: Run End-of-Shift Closing Duty Check
        run: bash skills/head-chef-mode/scripts/closing-duty.sh
